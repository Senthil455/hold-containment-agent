[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hold-containment-agent"
version = "1.0.0"
description = "HOLD: a one-way containment agent for food-safety recalls, built on Amazon Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Senthil455" }]
keywords = ["bedrock", "agentcore", "ai-safety", "food-safety", "containment", "guardrails"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
live = ["boto3>=1.39.0"]
agentcore = ["bedrock-agentcore>=1.0.0"]
dev = []

[tool.setuptools.packages.find]
include = ["hold*", "agent*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py311"
