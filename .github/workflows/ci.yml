name: hold-evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q hold agent evals demo infra
      - name: Unit and property tests
        run: python -m unittest discover -s tests -v
      - name: Adversarial suite
        run: python -m evals.run_stress --print
      - name: End-to-end smoke
        run: python scripts/smoke.py
      - name: Package wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python scripts/verify_wheel.py
